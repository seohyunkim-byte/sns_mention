[project]
name = "sns-mention"
version = "0.1.0"
description = "브랜드 맞춤형 인스타그램 캡션 자동 생성기 (MVP)"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.36",
    "anthropic>=0.45",
    "pydantic>=2.7",
    "instaloader>=4.13",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
